# action.yaml
---
name: 'github-app-installation-auth'
description: 'Authenticate as a GitHub App installation and generate an access token'
branding:
  icon: lock
  color: blue
inputs:
  private-key:
    description: 'GitHub App Private Key (RSA PEM format)'
    required: true
  app-id:
    description: 'GitHub App ID'
    required: true
outputs:
  github_app_token:
    description: 'GitHub App Installation Access Token'
    # need to specify the extra `value` field for `composite` actions
    value: ${{ steps.get-token.outputs.github_app_token }}
runs:
  using: 'composite'
  steps:
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Dependencies
      run: pip install -r ${{ github.action_path }}/requirements.txt
      shell: bash
    - name: Get GitHub App Token
      id: get-token
      run: |
        GITHUB_APP_TOKEN=$(${{ github.action_path }}/src/github_app_token.py \
          --direct \
          --app-id "${{ inputs.app-id }}" \
          --private-key "${{ inputs.private-key }}"
        )
        echo "github_app_token=$GITHUB_APP_TOKEN" >> $GITHUB_OUTPUT
      shell: bash
